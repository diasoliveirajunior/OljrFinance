<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Usuários — Portal OlJr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #091016;
            background-image: radial-gradient(circle at center, #162436 0%, #05080c 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Loading ── */
        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #091016;
            z-index: 999;
            gap: 16px;
        }
        .loader-ring {
            width: 40px; height: 40px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.7);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Top Bar ── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 48px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            background: rgba(9,16,22,0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar-left { display: flex; align-items: center; gap: 20px; }

        .logo {
            font-weight: 300;
            font-size: 1.1rem;
            letter-spacing: 3px;
            padding: 8px 14px;
            border: 1px solid rgba(255,255,255,0.35);
            text-transform: uppercase;
            text-decoration: none;
            color: #fff;
        }

        .admin-chip {
            background: rgba(255,215,0,0.12);
            border: 1px solid rgba(255,215,0,0.4);
            color: #ffd700;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .top-bar-right { display: flex; align-items: center; gap: 12px; }

        .btn-nav {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #8fa0b5;
            padding: 8px 18px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-nav:hover { border-color: rgba(255,255,255,0.45); color: #fff; }

        .btn-logout {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #8fa0b5;
            padding: 8px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        .btn-logout:hover { border-color: rgba(255,255,255,0.6); color: #fff; }

        /* ── Main ── */
        .main-content {
            flex: 1;
            padding: 48px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: none;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title-group {}

        .page-label {
            font-size: 0.68rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #8fa0b5;
            margin-bottom: 8px;
        }

        .page-title {
            font-size: clamp(1.4rem, 2.5vw, 2rem);
            font-weight: 300;
            letter-spacing: 2px;
        }
        .page-title span { font-weight: 700; }

        .btn-refresh {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            color: #8fa0b5;
            padding: 10px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-refresh:hover { border-color: rgba(255,255,255,0.45); color: #fff; }
        .btn-refresh.loading svg { animation: spin 0.6s linear infinite; }

        /* ── Stats Bar ── */
        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(22,36,54,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.68rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8fa0b5;
        }

        .stat-card.total  { border-color: rgba(255,255,255,0.12); }
        .stat-card.pendente .stat-value { color: #ffd666; }
        .stat-card.pendente { border-color: rgba(255,214,102,0.2); }
        .stat-card.aprovado .stat-value { color: #75e886; }
        .stat-card.aprovado { border-color: rgba(117,232,134,0.2); }
        .stat-card.bloqueado .stat-value { color: #ff8896; }
        .stat-card.bloqueado { border-color: rgba(255,136,150,0.2); }

        /* ── Table Container ── */
        .table-wrap {
            background: rgba(22,36,54,0.45);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 10px;
            overflow: hidden;
        }

        .table-toolbar {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .table-count {
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #8fa0b5;
        }

        .filter-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #8fa0b5;
            padding: 5px 14px;
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .pill:hover, .pill.active { border-color: rgba(255,255,255,0.5); color: #fff; background: rgba(255,255,255,0.05); }
        .pill.active { background: rgba(255,255,255,0.08); }

        /* ── Table ── */
        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table thead th {
            padding: 14px 20px;
            text-align: left;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #8fa0b5;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            white-space: nowrap;
        }

        .users-table tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.2s ease;
        }
        .users-table tbody tr:last-child { border-bottom: none; }
        .users-table tbody tr:hover { background: rgba(255,255,255,0.03); }

        .users-table tbody td {
            padding: 16px 20px;
            font-size: 0.82rem;
            font-weight: 300;
            color: #c0d4e8;
            vertical-align: middle;
        }

        .td-name  { font-weight: 400; color: #ffffff; }
        .td-email { color: #8fa0b5; font-size: 0.78rem; }
        .td-vinculo {
            font-size: 0.68rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8fa0b5;
        }

        /* Status badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .status-badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
        }
        .status-badge.pendente {
            background: rgba(255,214,102,0.12);
            border: 1px solid rgba(255,214,102,0.3);
            color: #ffd666;
        }
        .status-badge.pendente::before { background: #ffd666; }

        .status-badge.aprovado {
            background: rgba(117,232,134,0.1);
            border: 1px solid rgba(117,232,134,0.3);
            color: #75e886;
        }
        .status-badge.aprovado::before { background: #75e886; }

        .status-badge.bloqueado {
            background: rgba(255,136,150,0.1);
            border: 1px solid rgba(255,136,150,0.3);
            color: #ff8896;
        }
        .status-badge.bloqueado::before { background: #ff8896; }

        /* Actions */
        .actions-cell { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .btn-action {
            padding: 6px 14px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .btn-approve {
            background: rgba(117,232,134,0.1);
            border-color: rgba(117,232,134,0.35);
            color: #75e886;
        }
        .btn-approve:hover:not(:disabled) {
            background: rgba(117,232,134,0.2);
            border-color: #75e886;
            box-shadow: 0 0 12px rgba(117,232,134,0.15);
        }

        .btn-revoke {
            background: rgba(255,136,150,0.1);
            border-color: rgba(255,136,150,0.35);
            color: #ff8896;
        }
        .btn-revoke:hover:not(:disabled) {
            background: rgba(255,136,150,0.2);
            border-color: #ff8896;
            box-shadow: 0 0 12px rgba(255,136,150,0.15);
        }

        .btn-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Empty / Error states */
        .table-state {
            padding: 60px 20px;
            text-align: center;
            color: #8fa0b5;
        }
        .table-state p { font-size: 0.82rem; font-weight: 300; letter-spacing: 1px; }
        .table-state .icon { margin-bottom: 16px; opacity: 0.4; }

        /* ── Toast Notification ── */
        #toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            animation: slideIn 0.3s ease;
            max-width: 320px;
        }
        .toast.success {
            background: rgba(40,167,69,0.18);
            border: 1px solid rgba(40,167,69,0.45);
            color: #75e886;
        }
        .toast.error {
            background: rgba(220,53,69,0.18);
            border: 1px solid rgba(220,53,69,0.45);
            color: #ff8896;
        }

        @keyframes slideIn {
            from { transform: translateX(40px); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .top-bar { padding: 18px 20px; }
            .main-content { padding: 28px 16px; }
            .users-table thead th:nth-child(4),
            .users-table tbody td:nth-child(4) { display: none; }
        }
        @media (max-width: 640px) {
            .users-table thead th:nth-child(3),
            .users-table tbody td:nth-child(3) { display: none; }
            .stats-bar { display: grid; grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="loader-ring"></div>
        <span style="font-size:0.75rem;letter-spacing:3px;text-transform:uppercase;color:#8fa0b5;">Verificando acesso...</span>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-bar-left">
            <a class="logo" href="/hub.html">OlJr.</a>
            <span class="admin-chip">⚡ Administrador</span>
        </div>
        <div class="top-bar-right">
            <a class="btn-nav" href="/hub.html">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Hub
            </a>
            <button class="btn-logout" id="btn-logout">Sair</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="main-content">

        <div class="page-header">
            <div class="page-title-group">
                <div class="page-label">Painel Administrativo</div>
                <h1 class="page-title">Gestão de <span>Usuários</span></h1>
            </div>
            <button class="btn-refresh" id="btn-refresh" onclick="loadUsers()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Atualizar
            </button>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card total">
                <div class="stat-value" id="stat-total">—</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card pendente">
                <div class="stat-value" id="stat-pendente">—</div>
                <div class="stat-label">Pendentes</div>
            </div>
            <div class="stat-card aprovado">
                <div class="stat-value" id="stat-aprovado">—</div>
                <div class="stat-label">Aprovados</div>
            </div>
            <div class="stat-card bloqueado">
                <div class="stat-value" id="stat-bloqueado">—</div>
                <div class="stat-label">Bloqueados</div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <div class="table-toolbar">
                <span class="table-count" id="table-count">—</span>
                <div class="filter-pills">
                    <button class="pill active" data-filter="all" onclick="applyFilter('all', this)">Todos</button>
                    <button class="pill" data-filter="pendente"  onclick="applyFilter('pendente', this)">Pendentes</button>
                    <button class="pill" data-filter="aprovado"  onclick="applyFilter('aprovado', this)">Aprovados</button>
                    <button class="pill" data-filter="bloqueado" onclick="applyFilter('bloqueado', this)">Bloqueados</button>
                </div>
            </div>

            <div id="table-container">
                <div class="table-state">
                    <div class="icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </div>
                    <p>Carregando usuários...</p>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAze2Xj1H7QhZCz2z_ktR5b1qspbY9NPiI",
            authDomain: "oliveirajunior-eca87.firebaseapp.com",
            projectId: "oliveirajunior-eca87",
            storageBucket: "oliveirajunior-eca87.firebasestorage.app",
            messagingSenderId: "308166224942",
            appId: "1:308166224942:web:46ec1026ea8c7d0d79c3bf"
        };

        const ADMIN_EMAIL = 'diasoliveirajunior@gmail.com';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Expose auth to global scope for action buttons
        window._auth = auth;
        window._adminEmail = ADMIN_EMAIL;

        onAuthStateChanged(auth, (user) => {
            if (!user || user.uid !== ADMIN_EMAIL) {
                window.location.href = '/index.html';
                return;
            }
            document.getElementById('loading').style.display    = 'none';
            document.getElementById('main-content').style.display = 'block';
            window.loadUsers();
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = '/index.html';
        });
    </script>

    <script>
        // ── State ──
        let _allUsers = [];
        let _currentFilter = 'all';

        // ── Toast ──
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // ── Format Date ──
        function formatDate(user) {
            if (user.createdAt) {
                const secs = user.createdAt._seconds || user.createdAt.seconds;
                if (secs) return new Date(secs * 1000).toLocaleDateString('pt-BR');
                if (typeof user.createdAt === 'number') return new Date(user.createdAt).toLocaleDateString('pt-BR');
            }
            if (user.Ultima_Validacao) {
                return new Date(user.Ultima_Validacao).toLocaleDateString('pt-BR');
            }
            return '—';
        }

        // ── Vinculo label ──
        const vinculoLabel = { ceo: 'CEO — OlJr', publico: 'Órgão Público', privado: 'Empresa Privada', particular: 'Particular' };

        // ── Render Table ──
        function renderTable(users) {
            const container = document.getElementById('table-container');

            if (!users || users.length === 0) {
                container.innerHTML = `
                    <div class="table-state">
                        <div class="icon">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <p>Nenhum usuário encontrado para este filtro.</p>
                    </div>`;
                return;
            }

            const rows = users.map(u => {
                const status = u.status || 'pendente';
                const email  = u.id;
                const isAdminUser = (email === window._adminEmail);
                const statusLabel = { pendente: 'Pendente', aprovado: 'Aprovado', bloqueado: 'Bloqueado' }[status] || 'Pendente';

                const approveDisabled = (status === 'aprovado' || isAdminUser) ? 'disabled' : '';
                const revokeDisabled  = (status === 'bloqueado' || isAdminUser) ? 'disabled' : '';

                return `
                <tr id="row-${CSS.escape(email)}">
                    <td class="td-name">${u.nome || '—'}</td>
                    <td class="td-email">${email}</td>
                    <td class="td-vinculo">${vinculoLabel[u.vinculo] || (u.vinculo || '—')}</td>
                    <td>${u.instituicao || '—'}</td>
                    <td>${formatDate(u)}</td>
                    <td><span class="status-badge ${status}" id="badge-${CSS.escape(email)}">${statusLabel}</span></td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn-action btn-approve"
                                ${approveDisabled}
                                onclick="handleAction('approve', '${email}', this)">
                                Aprovar
                            </button>
                            <button class="btn-action btn-revoke"
                                ${revokeDisabled}
                                onclick="handleAction('revoke', '${email}', this)">
                                Revogar
                            </button>
                        </div>
                    </td>
                </tr>`;
            }).join('');

            container.innerHTML = `
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Vínculo</th>
                            <th>Instituição</th>
                            <th>Cadastro</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
        }

        // ── Update Stats ──
        function updateStats(users) {
            const total    = users.length;
            const pendente = users.filter(u => (u.status || 'pendente') === 'pendente').length;
            const aprovado = users.filter(u => u.status === 'aprovado').length;
            const bloqueado = users.filter(u => u.status === 'bloqueado').length;

            document.getElementById('stat-total').textContent    = total;
            document.getElementById('stat-pendente').textContent  = pendente;
            document.getElementById('stat-aprovado').textContent  = aprovado;
            document.getElementById('stat-bloqueado').textContent = bloqueado;
        }

        // ── Apply Filter ──
        window.applyFilter = function(filter, btn) {
            _currentFilter = filter;
            document.querySelectorAll('.filter-pills .pill').forEach(p => p.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const filtered = filter === 'all'
                ? _allUsers
                : _allUsers.filter(u => (u.status || 'pendente') === filter);

            document.getElementById('table-count').textContent = `${filtered.length} usuário${filtered.length !== 1 ? 's' : ''}`;
            renderTable(filtered);
        };

        // ── Load Users ──
        window.loadUsers = async function() {
            const btn = document.getElementById('btn-refresh');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const user = window._auth.currentUser;
                const token = await user.getIdToken(true);

                const res = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.error || 'Erro ao buscar usuários.');
                }

                const data = await res.json();
                _allUsers = data.users || [];
                updateStats(_allUsers);
                applyFilter(_currentFilter, document.querySelector(`.pill[data-filter="${_currentFilter}"]`));

            } catch (err) {
                showToast(err.message || 'Erro ao carregar usuários.', 'error');
                document.getElementById('table-container').innerHTML = `
                    <div class="table-state">
                        <div class="icon">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                        </div>
                        <p>Erro ao carregar usuários. Tente novamente.</p>
                    </div>`;
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        };

        // ── Handle Approve / Revoke ──
        window.handleAction = async function(action, email, btn) {
            const endpoint  = action === 'approve' ? '/api/admin/approve-user' : '/api/admin/revoke-user';
            const newStatus = action === 'approve' ? 'aprovado' : 'bloqueado';
            const label     = action === 'approve' ? 'Aprovado' : 'Bloqueado';

            btn.disabled = true;
            btn.textContent = '...';

            try {
                const user  = window._auth.currentUser;
                const token = await user.getIdToken(true);

                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Erro ao executar ação.');

                // Update in-memory data
                const u = _allUsers.find(x => x.id === email);
                if (u) u.status = newStatus;

                // Update badge inline
                const badge = document.getElementById(`badge-${CSS.escape(email)}`);
                if (badge) {
                    badge.className = `status-badge ${newStatus}`;
                    badge.textContent = label;
                }

                // Update stats
                updateStats(_allUsers);

                // Re-render if filtered view needs update
                if (_currentFilter !== 'all' && _currentFilter !== newStatus) {
                    applyFilter(_currentFilter, document.querySelector(`.pill[data-filter="${_currentFilter}"]`));
                } else {
                    // Refresh button states on the row
                    const row = document.getElementById(`row-${CSS.escape(email)}`);
                    if (row) {
                        const approveBtn = row.querySelector('.btn-approve');
                        const revokeBtn  = row.querySelector('.btn-revoke');
                        if (approveBtn) approveBtn.disabled = (newStatus === 'aprovado');
                        if (revokeBtn)  revokeBtn.disabled  = (newStatus === 'bloqueado');
                        if (approveBtn) approveBtn.textContent = 'Aprovar';
                        if (revokeBtn)  revokeBtn.textContent  = 'Revogar';
                    }
                }

                showToast(data.message, 'success');

            } catch (err) {
                showToast(err.message || 'Erro ao executar ação.', 'error');
                btn.disabled = false;
                btn.textContent = action === 'approve' ? 'Aprovar' : 'Revogar';
            }
        };
    </script>
</body>
</html>
