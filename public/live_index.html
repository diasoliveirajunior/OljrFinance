<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Oliveira Junior - OlJr | Painel Profissional</title>

    <!-- Fontes do Google: Montserrat (Minimalista, fina e moderna) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;700&display=swap" rel="stylesheet">

    <style>
        /* Reset de estilos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #091016;
            /* Fundo azul/ardósia muito escuro, estilo cinemático */
            background-image: radial-gradient(circle at center, #162436 0%, #05080c 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Overlay para dar profundidade 3D / Vinheta */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.4) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Top Bar Minimalista com Menu */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 300;
            font-size: 1.2rem;
            letter-spacing: 3px;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        /* Menu de Navegação */
        .main-nav {
            display: flex;
            gap: 40px;
        }

        .main-nav a {
            color: #8fa0b5;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .main-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Conteúdo Central */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            z-index: 10;
            position: relative;
        }

        /* Efeito do Relógio/Bússola Animado */
        .dial-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            z-index: -1;
            pointer-events: none;
            /* Rotação super lenta e contínua do conjunto todo */
            animation: rotateDial 60s linear infinite;
        }

        .tick {
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            transform-origin: center;
        }

        .tick::before,
        .tick::after {
            content: '';
            position: absolute;
            left: 0;
            width: 1px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.3);
            /* Efeito de respiração/crescimento suave */
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .tick::after {
            bottom: 0;
            top: auto;
        }

        /* Rotação base das linhas */
        .tick:nth-child(1) {
            transform: translateX(-50%) rotate(0deg);
        }

        .tick:nth-child(2) {
            transform: translateX(-50%) rotate(45deg);
        }

        .tick:nth-child(3) {
            transform: translateX(-50%) rotate(90deg);
        }

        .tick:nth-child(4) {
            transform: translateX(-50%) rotate(135deg);
        }

        /* Atraso na animação para dar o efeito "uma a uma", de forma elegante */
        .tick:nth-child(1)::before,
        .tick:nth-child(1)::after {
            animation-delay: 0s;
        }

        .tick:nth-child(2)::before,
        .tick:nth-child(2)::after {
            animation-delay: 1s;
        }

        .tick:nth-child(3)::before,
        .tick:nth-child(3)::after {
            animation-delay: 2s;
        }

        .tick:nth-child(4)::before,
        .tick:nth-child(4)::after {
            animation-delay: 3s;
        }

        /* Tipografia */
        .pre-title {
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #8fa0b5;
            margin-bottom: 15px;
        }

        .title {
            font-size: clamp(3rem, 6vw, 5rem);
            /* Tamanho ajustado para caber o nome completo */
            font-weight: 700;
            line-height: 1;
            letter-spacing: 6px;
            margin-bottom: 15px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .sub-title {
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #8fa0b5;
            margin-bottom: 40px;
        }

        /* Grupo de Botões (Login e Cadastro) */
        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        /* Estilo base dos botões */
        .cta-button {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 40px;
            font-size: 0.8rem;
            font-weight: 400;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.4s ease;
            font-family: 'Montserrat', sans-serif;
            backdrop-filter: blur(5px);
            min-width: 160px;
        }

        /* Botão Primário (Login) em destaque */
        .cta-button.primary {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .cta-button.primary:hover {
            background: #ffffff;
            color: #091016;
            font-weight: 700;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        /* Botão Secundário (Cadastro) mais discreto */
        .cta-button.secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        /* Redes Sociais Laterais */
        .social-sidebar {
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 10;
        }

        .social-sidebar a {
            color: #ffffff;
            opacity: 0.5;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .social-sidebar a:hover {
            opacity: 1;
            transform: translateX(-3px);
        }

        /* Responsivo para telemóveis */
        @media (max-width: 768px) {
            .top-bar {
                padding: 25px;
                flex-direction: column;
                gap: 20px;
            }

            .main-nav {
                gap: 20px;
            }

            .main-nav a {
                font-size: 0.75rem;
            }

            .social-sidebar {
                position: relative;
                right: 0;
                top: 0;
                transform: none;
                flex-direction: row;
                margin-top: 50px;
                justify-content: center;
            }

            .dial-container {
                width: 300px;
                height: 300px;
            }

            .title {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }

            .button-group {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
                gap: 15px;
            }

            .cta-button {
                width: 100%;
            }
        }

        /* --- Animações Keyframes --- */

        @keyframes rotateDial {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                height: 20px;
                opacity: 0.3;
                box-shadow: none;
            }

            50% {
                height: 40px;
                opacity: 0.8;
                box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            }
        }

        /* --- Estilos da Modal de Autenticação (Glassmorphism) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: rgba(22, 36, 54, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #8fa0b5;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        /* Abas da Modal */
        .modal-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
        }

        .modal-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            color: #8fa0b5;
            cursor: pointer;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .modal-tab.active {
            color: #ffffff;
            font-weight: 400;
            border-bottom-color: #ffffff;
        }

        /* Formulários */
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.75rem;
            color: #8fa0b5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group input,
        .input-group select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .input-group select option {
            background: #091016;
            color: #ffffff;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .auth-submit {
            margin-top: 10px;
            background: #ffffff;
            color: #091016;
            border: none;
            padding: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .auth-submit:hover {
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .hidden-field {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- Efeito de sombra/profundidade -->
    <div class="bg-overlay"></div>

    <!-- Barra de Navegação no topo -->
    <header class="top-bar">
        <!-- Logo envolto num quadrado fino -->
        <div class="logo">OlJr.</div>
        
        <!-- Link de Login estilo Microsoft (mas no nosso design) -->
        <button class="top-login" id="btn-top-login" onclick="document.getElementById('auth-modal').classList.add('active'); document.getElementById('form-login').classList.add('active'); document.getElementById('form-signup').classList.remove('active');" style="background: none; border: none; color: inherit; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 400; transition: all 0.3s ease; padding: 10px; z-index: 9999; position: relative;">
            <span class="btn-text">Entrar</span>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="border-radius: 50%; border: 1px solid currentColor; padding: 4px; pointer-events: none;">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </button>
    </header>

    <!-- Conteúdo principal -->
    <main class="main-content">

        <!-- O gráfico de relógio/bússola Animado ao fundo do texto -->
        <div class="dial-container">
            <div class="tick"></div>
            <div class="tick"></div>
            <div class="tick"></div>
            <div class="tick"></div>
        </div>

        <div class="pre-title">Oliveira Junior</div>

        <h1 class="title">OLJR ANALYTICS</h1>

        <div class="sub-title">Plataforma integrada de inteligência de dados e gestão executiva.</div>

        <!-- Área de Acesso / Admin Backdoor -->
        <div class="button-group" style="justify-content: center;">
            <button class="cta-button primary" id="btn-open-login">Entrar</button>
        </div>

        <!-- Redes sociais em coluna à direita (ou em baixo no mobile) -->
        <div class="social-sidebar">
            <a href="#" aria-label="Facebook">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                </svg>
            </a>
            <a href="#" aria-label="Twitter">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z">
                    </path>
                </svg>
            </a>
            <a href="#" aria-label="Instagram">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
            </a>
        </div>
    </main>

    <!-- Modal de Autenticação -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">&times;</span>
            
            <h2 style="margin-bottom: 25px; font-weight: 400; font-size: 1.8rem; text-align: left;">Entrar</h2>

            <!-- Formulário de Login -->
            <form class="auth-form active" id="form-login">
                <div class="input-group">
                    <label for="login-email">E-MAIL</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com">
                </div>
                <div class="input-group hidden-field" id="login-token-group">
                    <label for="login-token">CÓDIGO DE ACESSO</label>
                    <input type="text" id="login-token" placeholder="000000" maxlength="6" autocomplete="one-time-code">
                </div>
                
                <div style="margin-top: 5px; font-size: 0.85rem; color: #8fa0b5; text-align: left;">
                    Não tem acesso? <a href="#" id="link-to-signup" style="color: #ffffff; text-decoration: none; font-weight: 600;">Solicitar acesso</a>
                </div>

                <div style="display: flex; justify-content: flex-end; margin-top: 15px;">
                    <button type="submit" class="auth-submit" style="margin: 0; min-width: 120px;">Avançar</button>
                </div>
            </form>

            <!-- Formulário de Cadastro Inteligente -->
            <form class="auth-form" id="form-signup">
                <div class="input-group">
                    <label for="signup-type">TIPO DE VÍNCULO</label>
                    <select id="signup-type" required>
                        <option value="" disabled selected>Selecione...</option>
                        <option value="ceo">CEO (Chief Executive Officer - OlJr)</option>
                        <option value="equipe_oljr">Equipe Oliveira Junior - OlJr</option>
                        <option value="publico">Órgão Público</option>
                        <option value="privado">Empresa Privada</option>
                        <option value="particular">Particular (Pessoa Física)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="signup-name">NOME COMPLETO</label>
                    <input type="text" id="signup-name" required placeholder="Seu nome">
                </div>
                <div class="input-group">
                    <label for="signup-email">E-MAIL</label>
                    <input type="email" id="signup-email" required placeholder="seu@email.com">
                </div>
                <div class="input-group hidden-field" id="signup-token-group">
                    <label for="signup-token">CÓDIGO DE ACESSO</label>
                    <input type="text" id="signup-token" placeholder="000000" maxlength="6" autocomplete="one-time-code">
                </div>

                
                <!-- Campos dinâmicos -->
                <div class="input-group hidden-field" id="group-public-sector">
                    <label for="signup-public-sector">Órgão</label>
                    <select id="signup-public-sector">
                        <option value="" disabled selected>Selecione o Órgão...</option>
                        <optgroup label="Secretarias de Estado">
                            <option value="CASA CIVIL">CASA CIVIL</option>
                            <option value="SEAF">SEAF - Sec. de Agricultura Familiar</option>
                            <option value="SETASC">SETASC - Sec. de Assistência Social</option>
                            <option value="SECITECI">SECITECI - Sec. de Ciência e Tecnologia</option>
                            <option value="SECOM">SECOM - Sec. de Comunicação</option>
                            <option value="SECEL">SECEL - Sec. de Cultura, Esporte e Lazer</option>
                            <option value="SEDEC">SEDEC - Sec. de Desenv. Econômico</option>
                            <option value="SEDUC">SEDUC - Sec. de Educação</option>
                            <option value="SEFAZ">SEFAZ - Sec. de Fazenda</option>
                            <option value="SINFRA">SINFRA - Sec. de Infraestrutura</option>
                            <option value="SEJUS">SEJUS - Sec. de Justiça</option>
                            <option value="SEMA">SEMA - Sec. de Meio Ambiente</option>
                            <option value="SEPLAG">SEPLAG - Sec. de Planejamento e Gestão</option>
                            <option value="SES">SES - Sec. de Saúde</option>
                            <option value="SESP">SESP - Sec. de Segurança Pública</option>
                            <option value="ERMAT">ERMAT - Representação em Brasília</option>
                        </optgroup>
                        <optgroup label="Órgãos Essenciais à Justiça e ao Controle">
                            <option value="CGE">CGE - Controladoria Geral do Estado</option>
                            <option value="DPE">DPE - Defensoria Pública do Estado de Mato Grosso</option>
                            <option value="MPMT">MPMT - Ministério Público de Mato Grosso</option>
                            <option value="PGE">PGE - Procuradoria Geral do Estado</option>
                            <option value="TCE">TCE - Tribunal de Contas do Estado</option>
                        </optgroup>
                        <optgroup label="Demais Poderes do Estado">
                            <option value="ALMT">ALMT - Assembleia Legislativa de Mato Grosso</option>
                            <option value="TJMT">TJMT - Tribunal de Justiça de Mato Grosso</option>
                        </optgroup>
                        <optgroup label="Autarquias">
                            <option value="DETRAN">DETRAN - Dep. de Trânsito</option>
                            <option value="INDEA">INDEA - Defesa Agropecuária</option>
                            <option value="INTERMAT">INTERMAT - Instituto de Terras</option>
                            <option value="JUCEMAT">JUCEMAT - Junta Comercial</option>
                            <option value="AGER">AGER - Agência de Regulação</option>
                            <option value="UNEMAT">UNEMAT - Universidade do Estado</option>
                            <option value="IPEM">IPEM - Pesos e Medidas</option>
                            <option value="MT PREV">MT PREV - Mato Grosso Previdência</option>
                        </optgroup>
                        <optgroup label="Fundações Públicas">
                            <option value="FAPEMAT">FAPEMAT - Amparo à Pesquisa</option>
                            <option value="FNC">FNC - Fundação Nova Chance</option>
                        </optgroup>
                        <optgroup label="Empresas Públicas e Sociedades">
                            <option value="MTI">MTI - Empresa MT de Tecnologia</option>
                            <option value="DESENVOLVE MT">DESENVOLVE MT - Agência de Fomento</option>
                            <option value="MT PAR">MT PAR - Mato Grosso Parcerias</option>
                            <option value="CEASA">CEASA - Centrais de Abastecimento</option>
                            <option value="METAMAT">METAMAT - Companhia de Mineração</option>
                        </optgroup>
                        <option value="OUTROS">OUTROS</option>
                    </select>
                </div>

                <div class="input-group hidden-field" id="group-private-sector">
                    <label for="signup-private-sector">Empresa Cadastrada</label>
                    <select id="signup-private-sector">
                        <option value="" disabled selected>Selecione sua Empresa...</option>
                        <option value="EMPRESA_A">Empresa Parceira A</option>
                        <option value="EMPRESA_B">Empresa Parceira B</option>
                        <option value="EMPRESA_C">Fornecedor C</option>
                        <!-- Adicione mais empresas autorizadas aqui -->
                    </select>
                </div>

                <div style="display: flex; justify-content: space-between; margin-top: 15px; gap: 15px;">
                    <button type="button" class="auth-submit" id="btn-back-to-login" style="margin: 0; background: rgba(255,255,255,0.1); color: #fff; min-width: 100px;">Voltar</button>
                    <button type="submit" class="auth-submit" style="margin: 0; flex: 1;">Avançar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Autenticação Firebase e UI -->
    <script type="module" src="./app-auth.js"></script>

</body>

</html>
