name: Verificações do Finance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portal/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: portal
      - run: npm run build
        working-directory: portal
      - run: npm run lint
        working-directory: portal
      - run: node --test backend/finance-import.test.js backend/finance-import-save.test.js backend/finance-google-drive.test.js
